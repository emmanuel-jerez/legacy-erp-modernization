[project]
name = "erp-migration-agent"
version = "0.1.0"
description = "Agent that ports legacy ERP business rules to modern code and proves parity with characterization tests"
requires-python = ">=3.12"
dependencies = [
    "erp-sandbox",
    "langgraph>=1.2.23",
    "langgraph-checkpoint-sqlite>=3.1.3",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
erp-sandbox = { path = "../erp-sandbox", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "migrated"]
addopts = "--import-mode=importlib"
markers = ["integration: needs the running sandbox database"]
